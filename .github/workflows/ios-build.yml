# Build the iPhone app on GitHub's Mac and upload it to App Store Connect (TestFlight). No Mac or Xcode needed.
# Start it from GitHub (phone works): Actions > "iOS build and upload" > Run workflow.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   APPLE_TEAM_ID    10-character Team ID (developer.apple.com/account > Membership details)
#   ASC_KEY_ID       App Store Connect API key ID          (App Store Connect > Users and Access > Integrations >
#   ASC_ISSUER_ID    Issuer ID shown above the keys list    App Store Connect API > Team Keys, access: Admin)
#   ASC_KEY_P8       the whole .p8 file, including the BEGIN/END lines
# Admin access lets Xcode create the distribution certificate and profile in the cloud (automatic signing).

name: iOS build and upload

on:
  workflow_dispatch:

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode (latest stable)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KID ISS P8; do [ -n "${!v}" ] || { echo "Missing secret for $v (see the top of this file)"; exit 1; }; done

      - name: Capacitor sync (RevenueCat + native plugins)
        working-directory: app
        run: |
          npm ci
          npx cap sync ios

      - name: API key file
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey.p8"

      - name: Archive
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          BUILD_NUMBER=$(date -u +%Y%m%d%H%M)   # always higher than the last upload
          echo "Build number: $BUILD_NUMBER"
          xcodebuild archive \
            -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER"

      - name: Upload to App Store Connect
        working-directory: app/ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "Uploaded. It shows up in App Store Connect > TestFlight in 10-30 minutes."

      - name: Clean up key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
